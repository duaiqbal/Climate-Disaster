name: disaster_dss
description: Offline-first disaster decision-support system for Chitral, KP.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # State management
  provider: ^6.1.2

  # Location
  geolocator: ^12.0.0

  # HTTP
  http: ^1.2.1

  # Storage
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2

  # Connectivity
  connectivity_plus: ^6.0.3

  # Icons
  cupertino_icons: ^1.0.8

  # i18n
  intl: ^0.20.3

  # Permissions
  permission_handler: ^11.3.1

  # URL launcher
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/offline_package/knowledge.sqlite
    - assets/offline_package/hazard_grid.sqlite
    - assets/images/
    - assets/icons/
