services:
  - type: web
    name: chitral-safe-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements_deploy.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        value: chitral-safe-secret-2024-xk9mz3
      - key: ADMIN_API_KEY
        value: chitral-admin-key-2024-abc123
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./disaster_dss.sqlite
      - key: LLM_PROVIDER
        value: none
      - key: MONITOR_ENABLED
        value: "1"
      - key: MONITOR_INTERVAL_HOURS
        value: "6"
      - key: CORS_ORIGINS
        value: https://duaiqbal.github.io,http://localhost:8080
      - key: ACCESS_TOKEN_TTL
        value: "3600"
      - key: REFRESH_TOKEN_TTL
        value: "604800"
      - key: PYTHON_VERSION
        value: "3.12.0"
