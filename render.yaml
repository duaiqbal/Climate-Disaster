# ============================================================
# render.yaml — ChitralSafe Deployment Config for Render.com
# Docs: https://render.com/docs/blueprint-spec
# ============================================================

services:
  # ── Backend: FastAPI ────────────────────────────────────────
  - type: web
    name: chitral-safe-backend
    runtime: python
    region: singapore          # closest to Pakistan
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a random value
      - key: ADMIN_API_KEY
        generateValue: true        # Render auto-generates a random value
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./disaster_dss.sqlite
      - key: LLM_PROVIDER
        value: none                # No Ollama on free tier — retrieval only
      - key: MONITOR_ENABLED
        value: "1"
      - key: MONITOR_INTERVAL_HOURS
        value: "6"
      - key: CORS_ORIGINS
        value: https://chitral-safe-app.onrender.com,http://localhost:8080
      - key: ACCESS_TOKEN_TTL
        value: "3600"
      - key: REFRESH_TOKEN_TTL
        value: "604800"
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ── Frontend: Flutter Web ───────────────────────────────────
  - type: web
    name: chitral-safe-app
    runtime: static
    region: singapore
    plan: free
    rootDir: app
    buildCommand: >
      curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.24.3-stable.tar.xz |
      tar xJ -C /opt &&
      export PATH="$PATH:/opt/flutter/bin" &&
      flutter pub get &&
      flutter build web --release
        --dart-define=BACKEND_URL=https://chitral-safe-backend.onrender.com
        --no-web-resources-cdn
    staticPublishPath: app/build/web
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
