name: 🚀 Deploy ChitralSafe

on:
  push:
    branches: [ master ]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  # ── Job 1: Run Backend Tests ─────────────────────────────────────────────────
  test-backend:
    name: ✅ Backend Tests (122)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
        env:
          ENV: test

  # ── Job 2: Build and Deploy Flutter Web → GitHub Pages ───────────────────────
  deploy-flutter-web:
    name: 🌐 Deploy Flutter Web → GitHub Pages
    runs-on: ubuntu-latest
    needs: test-backend      # only deploy if tests pass
    permissions:
      contents: write        # needed to push to gh-pages branch

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: cd app && flutter pub get

      - name: Build Flutter Web (Release)
        run: |
          cd app
          flutter build web --release \
            --dart-define=BACKEND_URL=https://chitral-safe-backend.onrender.com \
            --no-web-resources-cdn \
            --base-href="/Climate-Disaster/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/build/web
          commit_message: "deploy: Flutter web build from ${{ github.sha }}"
          cname: ""          # leave empty unless you have a custom domain
