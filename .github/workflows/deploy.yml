name: Deploy ChitralSafe to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Flutter Web and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Flutter Web
        run: |
          cd app
          flutter build web --release \
            --dart-define=BACKEND_URL=https://chitral-safe-backend.onrender.com \
            --no-web-resources-cdn \
            --base-href="/Climate-Disaster/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/build/web
          commit_message: "deploy: ChitralSafe Flutter web"
